{% extends "base.html" %}{% block title %}Choose New Password{% endblock %}{% block content %}<div class="container" style="max-width:600px"><h1>Choose a new password</h1>{% if validlink %}<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary" type="submit">Change password</button></form>{% else %}<p>This reset link is invalid or has expired. Please request a new one.</p><a href="{% url 'password_reset' %}">Request another link</a>{% endif %}</div>{% endblock %}
