<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matoshree Cyber Center – Loading…</title>
<meta name="robots" content="noindex">
<noscript><meta http-equiv="refresh" content="0;url=https://matoshree-cyber.onrender.com/"></noscript>
<style>
  :root{--bg:#0f172a;--fg:#e2e8f0;--accent:#00e6ff;--track:rgba(0,230,255,.22);--dim:#94a3b8}
  @media (prefers-color-scheme: light){:root{--bg:#f8fafc;--fg:#0f172a;--accent:#0891b2;--track:rgba(8,145,178,.2);--dim:#475569}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:1.5rem}
  .box{max-width:420px;width:100%}
  .spinner{width:56px;height:56px;margin:0 auto 1.5rem;border:5px solid var(--track);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){.spinner{animation-duration:3s}}
  h1{font-size:1.4rem;margin:0 0 .5rem}
  p{color:var(--dim);margin:.25rem 0;line-height:1.5}
  .bar{height:6px;background:var(--track);border-radius:99px;overflow:hidden;margin:1.25rem 0 .5rem}
  .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .6s}
  .actions{display:none;margin-top:1rem;gap:.75rem;justify-content:center;flex-wrap:wrap}
  .actions.show{display:flex}
  button,a.btn{padding:.6rem 1.4rem;border:0;border-radius:99px;background:var(--accent);color:#04202a;font-weight:600;font-size:1rem;cursor:pointer;text-decoration:none;font-family:inherit}
</style>
</head>
<body>
<main class="box" role="status" aria-live="polite">
  <div class="spinner" aria-hidden="true"></div>
  <h1>Application loading…</h1>
  <p id="msg">Starting the server. This takes up to a minute the first time.</p>
  <div class="bar"><i id="fill"></i></div>
  <p id="timer"></p>
  <div class="actions" id="actions">
    <button id="retry" type="button">Try again</button>
    <a id="open" class="btn" href="https://matoshree-cyber.onrender.com/">Open website</a>
  </div>
</main>
<script>
(function () {
  // >>> Change this if your Render web-service URL is different <<<
  var SITE = "https://matoshree-cyber.onrender.com";

  var HEALTH = SITE + "/healthz/";
  var SLOW_AFTER_MS = 120000;       // show manual buttons after this, but KEEP polling
  var REQUEST_TIMEOUT_MS = 25000;   // one probe may take long while the DB wakes up
  var started = Date.now(), done = false;

  var msg = document.getElementById("msg"), fill = document.getElementById("fill"),
      timer = document.getElementById("timer"), actions = document.getElementById("actions"),
      retry = document.getElementById("retry"), openLink = document.getElementById("open");

  // Keep the visitor's destination after the wake-up. Supported forms:
  //   loader-site/services/?x=1   (needs the rewrite rule in render.yaml)
  //   loader-site/#/services/
  function destination() {
    var p = location.pathname, path = "/";
    if (p && p !== "/" && p !== "/index.html") path = p + location.search;
    else if (location.hash && location.hash.charAt(1) === "/") path = location.hash.slice(1);
    // Must be a same-site absolute path; never let input choose another host.
    if (path.charAt(0) !== "/" || path.charAt(1) === "/" || path.charAt(1) === "\\") path = "/";
    return SITE + path;
  }
  var target = destination();
  openLink.href = target;

  var steps = [
    [0, "Starting the server…"],
    [10000, "Waking up services…"],
    [25000, "Almost there, preparing the website…"],
    [60000, "Taking a bit longer than usual. Please keep this page open."]
  ];

  function tick() {
    if (done) return;
    var el = Date.now() - started;
    fill.style.width = Math.min(95, (el / 60000) * 100) + "%";
    timer.textContent = Math.floor(el / 1000) + "s";
    for (var i = steps.length - 1; i >= 0; i--) { if (el >= steps[i][0]) { msg.textContent = steps[i][1]; break; } }
    if (el > SLOW_AFTER_MS) {
      msg.textContent = "Still starting up. This page will open the website automatically when it is ready.";
      actions.className = "actions show";
    }
  }

  function check() {
    if (done) return;
    var ctrl = new AbortController(), t = setTimeout(function () { ctrl.abort(); }, REQUEST_TIMEOUT_MS);
    // deep=1 also pings the database so it is awake before we redirect.
    // No custom headers/cache option on purpose: keeps this a "simple" CORS request (no preflight).
    fetch(HEALTH + "?deep=1&t=" + Date.now(), { signal: ctrl.signal })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error("not ready")); })
      .then(function (j) {
        clearTimeout(t);
        if (j && j.status === "ok") {
          done = true; fill.style.width = "100%"; msg.textContent = "Ready! Opening website…";
          location.replace(target);
        } else { throw new Error("bad body"); }
      })
      .catch(function () { clearTimeout(t); setTimeout(check, 2500); });  // asleep / booting: keep trying
  }

  retry.addEventListener("click", function () {
    started = Date.now(); actions.className = "actions"; tick();
  });
  setInterval(tick, 500); tick(); check();
})();
</script>
</body>
</html>
